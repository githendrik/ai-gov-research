{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Params.tags }}<span class="post-tags">{{ range . }}<span class="tag">{{ . }}</span>{{ end }}</span>{{ end }}
    </div>
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  <footer class="post-footer">
    {{ with .Site.BaseURL }}<p><a href="{{ . }}">Back to all posts</a></p>{{ end }}
  </footer>
</article>
{{ end }}
