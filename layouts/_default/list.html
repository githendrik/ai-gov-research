{{ define "main" }}
<section class="post-list">
  <header class="list-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="list-desc">{{ . }}</p>{{ end }}
    <p class="feed-link">{{ T "subscribe" }}: <a href="{{ (printf "%sindex.xml" .RelPermalink) | safeURL }}">{{ T "rss" }}</a></p>
  </header>
  {{ range .Pages }}
  <article class="post-summary">
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format $.Site.Params.dateFormat }}</time>
    </div>
    <p class="summary">{{ .Summary }}</p>
  </article>
  {{ else }}
  <p>{{ T "no_posts" }}</p>
  {{ end }}
</section>
{{ end }}
