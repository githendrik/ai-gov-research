name: Weekly post reminder

# Cron fires Monday 09:00 UTC. The workflow does NOT publish automatically;
# it opens an issue reminding you to drop the new digest into docs/. Once you
# commit a new docs/YYYY-MM-DD-*.md file and push to main, Vercel auto-deploys
# and the transformer runs at build time.
#
# To auto-commit a draft post instead, replace the "remind" job with one that
# writes to docs/ using the GitHub REST API or a content-generation script.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly digest due: ${today}`,
              body: [
                `Time to publish this week's AI Governance digest.`,
                ``,
                `1. Add a file: \`docs/${today}-ai-governance.md\``,
                `2. Commit to \`main\` and push.`,
                `3. Vercel auto-deploys; the transformer runs at build time.`,
                ``,
                `Source format reminder: H1 title, dated sections, bracketed [NN] citations are fine.`
              ].join('\n'),
              labels: ['weekly-digest']
            });
