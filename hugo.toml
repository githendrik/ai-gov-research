baseURL = "https://aigov.philine.ch/"
title = "The AI Gov Digest"
copyright = "The AI Gov Digest"
enableRobotsTXT = true
enableGitInfo = true
defaultContentLanguage = "en"

# Promote date from filename: 2026-08-04-foo.md -> date=2026-08-04
[frontmatter]
  date = [":filename", ":default"]

[languages]
  [languages.en]
    locale = "en-US"
    contentDir = "content/en"
    weight = 1
    [languages.en.params]
      description = "A weekly digest of AI governance, regulation, and safety news."
      tagline = "Every week, the rules being written for artificial intelligence — what regulators shipped, what lawmakers argued over, and what actually changed. Researched, cited, and stripped of hype."
      dateFormat = "January 2, 2006"
  [languages.de]
    locale = "de-DE"
    contentDir = "content/de"
    weight = 2
    [languages.de.params]
      description = "Ein wöchentlicher Digest zu KI-Governance, -Regulierung und -Sicherheit."
      tagline = "Jede Woche die Regeln, die für Künstliche Intelligenz geschrieben werden — was Regulierer veröffentlichten, worüber Gesetzgeber stritten, und was sich tatsächlich veränderte. Recherchiert, belegt, ohne Hype."
      dateFormat = "02.01.2006"

[params]
  mainSections = ["posts"]
  [params.author]
    name = "AI Gov Research"
  [params.plausible]
    enabled = true
    domain = "aigov.philine.ch"
    src = "https://analytics.app.richert.li/js/script.js"
  [params.newsletter]
    enabled = true
    [params.newsletter.en]
      form_url = "https://8d08e528.sibforms.com/v2/serve/MUIFABuKH28uH-FplDAuUp3i4rfuUPgPagzZH8x6Hf-7PBcPQE5_yDm5yjsDbacJpki5SfAc3qVYOD19l-WDd7IWFniXlEHqazWRxBJ-bd0C2SQOx45BbWecEwzifcyzDgaKhIJQ00p8WCeXvzzq5qsr66_aNtF_TaV2iAUyW1nuiQqgZEWfOc5A75uw01csvQcNw9t3fa_wCKAj1Q=="
    [params.newsletter.de]
      form_url = "https://8d08e528.sibforms.com/v2/serve/MUIFALWjWfcQ3-mK03N1rrSU1d0z163SF1YDgc-VHNpog4jYCtAanFxoNfTvkJ9-AXcQ-0OOAcQRKsnsGXuNqgGW_JQDe-akRp7t6X4fKuQRJt0r67jK9C1G4xl5AapUp1pHT4lh4ugAvtWCG74WXSNZzXsYo52-mKxajBhNnvCQO1b2gzz5EzWwXFnd8yjA3FYhRPmUdOcaIiw5pA=="

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = false

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html", "rss"]

[taxonomies]
  tag = "tags"
  category = "categories"

[services]
  [services.rss]
    limit = 50
